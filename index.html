<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <video id="player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
        <!-- VIDEO DE PRUEBA REAL QUE SÍ FUNCIONA EN CHROME -->
        <source src="https://googleapis.com" type="video/mp4">
    </video>

    <script src="https://zencdn.net"></script>
    <script>
        videojs('player', { fluid: true });
    </script>
</body>
</html>
