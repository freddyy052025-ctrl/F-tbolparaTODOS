<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Optimizado</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body oncontextmenu="return false;">

    <video id="video" controls autoplay playsinline></video>

    <script>
        // PEGA AQUÍ TU URL LARGA NUEVA O ACTUALIZADA
        var videoSrc = 'https://dglvz29s.fubo18.com/foxsports2_usa/mono.m3u8?token=3d8885ca9d9ea2b8fa51e0d9e5d4ef60f9493c20-ef-1790601241-1790583241';
        var video = document.getElementById('video');

        if (Hls.isSupported()) {
            var hls = new Hls({
                maxMaxBufferLength: 10,
                enableWorker: true,
                lowLatencyMode: true
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) { console.log("Auto-play bloqueado por Chrome"); });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
